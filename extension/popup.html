<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mail Track</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header Row -->
    <div class="popup-header">
      <div class="brand">
        <div class="brand-badge-icon" aria-label="Mail Track Logo">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="8" fill="#047857"/>
            <g transform="translate(5, 5)">
              <path d="M12.5688 14.9068L14.0985 16.4364L23.2695 7.26537L24.8016 8.79743L14.0985 19.5005L7.20417 12.6062L8.73623 11.0742L11.0381 13.376L12.5688 14.9068ZM12.5707 11.8434L17.936 6.47799L19.4638 8.0058L14.0985 13.3711L12.5707 11.8434ZM9.5084 17.9698L7.97762 19.5005L1.08333 12.6062L2.61539 11.0742L4.14617 12.605L4.14488 12.6062L9.5084 17.9698Z" fill="white"/>
            </g>
          </svg>
        </div>
        <div class="brand-meta">
          <div class="title">Mail Track</div>
          <div class="version">v1.0.6</div>
        </div>
      </div>
      <button class="btn-settings" id="settingsBtn" title="Open Dashboard" aria-label="Open Dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- 1. NOT LOGGED IN VIEW -->
    <div id="loggedOutView" class="view-panel" style="display: none;">
      <div class="login-card">
        <div class="login-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="login-title">Log In to Mail Track</div>
        <div class="login-desc">Connect your Google account to start tracking email opens and link clicks in Gmail.</div>
        
        <button class="btn-login" id="loginBtn">
          <svg width="16" height="16" viewBox="0 0 24 24">
            <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Log In with Google</span>
        </button>

        <button class="btn-gmail" id="openGmailLoggedOutBtn" style="margin-top: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Open Gmail</span>
        </button>
      </div>
    </div>

    <!-- 2. LOGGED IN VIEW (Compact, No Active Tag, No View Dashboard) -->
    <div id="loggedInView" class="view-panel" style="display: none;">
      <!-- Profile Row -->
      <div class="profile-row">
        <div class="profile-left">
          <div class="avatar" id="userAvatar">NK</div>
          <div class="profile-meta">
            <div class="profile-name" id="userName">User</div>
            <div class="profile-email" id="userEmail">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Email Tracking Toggle Card -->
      <div class="tracking-toggle-card">
        <div class="tracking-toggle-left">
          <div class="tracking-icon-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <div class="tracking-text">
            <div class="tracking-title" id="trackingTitle">Email Tracking Active</div>
            <div class="tracking-sub" id="trackingSub">Live opens & link tracking enabled</div>
          </div>
        </div>
        <div class="toggle-switch active" id="trackingToggle" role="switch" aria-checked="true" tabindex="0" title="Toggle Email Tracking">
          <div class="toggle-knob"></div>
        </div>
      </div>

      <!-- Action Buttons Stack (Open Gmail + Log Out) -->
      <div class="actions-stack">
        <!-- Button 1: Open Gmail -->
        <button class="btn-gmail" id="openGmailBtn" title="Open Gmail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Open Gmail</span>
        </button>

        <!-- Button 2: Log Out -->
        <button class="btn-logout" id="logoutBtn" title="Log out of Mail Track">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Log Out</span>
        </button>
      </div>
    </div>

    <!-- 3. INITIAL LOADING SKELETON -->
    <div id="loadingView" class="view-panel">
      <div class="skeleton-card">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-line" style="width: 60%; height: 12px; margin-bottom: 6px;"></div>
        <div class="skeleton-line" style="width: 80%; height: 9px;"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
